<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Bot active</title>
  <style>
    body { margin: 0; background: #1d2226; color: #fff; font: 13px "Segoe UI", sans-serif; -webkit-app-region: drag; user-select: none; }
    .wrap { padding: 12px 14px; }
    .top { display: flex; align-items: center; gap: 8px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #ff4d4d; animation: pulse 1.2s infinite; }
    @keyframes pulse { 50% { opacity: .25; } }
    b { flex: 1; letter-spacing: .5px; }
    button { -webkit-app-region: no-drag; background: #ff4d4d; color: #fff; border: 0; border-radius: 6px; font: 600 12px "Segoe UI"; padding: 5px 12px; cursor: pointer; }
    #status { color: #cfd8dc; margin-top: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #count { color: #2dd4bf; font-weight: 600; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top"><span class="dot"></span><b>BOT ACTIVE</b><button id="stop">Stop</button></div>
    <div id="status">Starting...</div>
    <div id="count">0 saved</div>
  </div>
  <script>
    let saved = 0;
    document.getElementById('stop').onclick = () => window.bot.send({ cmd: 'stop' });
    window.bot.onEvent((ev) => {
      if (ev.type === 'status') document.getElementById('status').textContent = ev.value;
      if (ev.type === 'row') document.getElementById('count').textContent = `${++saved} saved`;
    });
  </script>
</body>
</html>
